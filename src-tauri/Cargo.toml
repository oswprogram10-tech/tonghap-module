[package]
name = "tonghap-module"
version = "0.1.0"
description = "2022 개정 초등 통합교과 수업 지원 앱 (가칭 바슬즐 탐험대)"
edition = "2021"
rust-version = "1.80"

[lib]
# Tauri 2 권장 구성. 이름이 bin과 겹치지 않도록 _lib 접미사 사용.
name = "tonghap_module_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
