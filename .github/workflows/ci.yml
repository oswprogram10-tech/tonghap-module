name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 데이터 검증·타입 검사·프론트엔드 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm run build

  windows-installer:
    name: 윈도우 설치 파일(NSIS) 빌드
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # 점검 도구가 쓰는 llama.cpp·whisper.cpp 윈도우 실행 파일 (버전은 src-tauri/engines.json)
      - run: npm run fetch:engines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Rust 단위 테스트는 프론트엔드 빌드 결과(dist)가 있어야 컴파일된다.
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # 코드 서명 전 단계: 서명되지 않은 설치 파일이 만들어짐 (SmartScreen 경고가 뜸)
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: tonghap-module-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
