name: 1년치 성능 점검

# 학급 25명이 1년 쓴 양(관찰 3,000건, 첨부 1,500개, 차시 400개)의 DB로 주요 명령의 시간을 재고,
# 상한(보통 PC에서 체감 지연 없음)을 넘으면 실패한다. DB 쿼리 성능이 대상이라 리눅스 러너로 충분하다.
# 무거워 평소 CI(ci.yml)와 분리했다. 설계: docs/design/16-year-scale-performance.md
on:
  workflow_dispatch:
  schedule:
    - cron: '43 20 * * 0' # 매주 일요일 20:43 UTC

permissions:
  contents: read

jobs:
  perf:
    name: 1년치 성능 점검(리눅스)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri 크레이트가 컴파일되려면 리눅스 WebKitGTK 개발 파일이 필요하다.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - run: npm ci
      # Rust 컴파일은 프론트엔드 빌드 결과(dist)가 있어야 한다.
      - run: npm run build
      # 릴리스 빌드로 잰다. 표는 --nocapture로 로그에 남는다.
      - name: 성능 측정
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --test perf -- --ignored --nocapture
